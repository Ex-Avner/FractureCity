# Set app to the name created in your Fly account before deploying.
primary_region = "lax"
kill_signal = "SIGTERM"
kill_timeout = 10

[build]
  dockerfile = "server/Dockerfile"
  ignorefile = "server/dockerignore"

[env]
  HOST = "0.0.0.0"
  PORT = "8080"
  MAX_ROOMS = "4"
  DB_PATH = "/data/districts.sqlite"
  BACKUP_DIR = "/data/backups"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  [http_service.concurrency]
    type = "connections"
    soft_limit = 150
    hard_limit = 200

[[http_service.checks]]
  interval = "15s"
  timeout = "3s"
  grace_period = "10s"
  method = "GET"
  path = "/health"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "1gb"

[[mounts]]
  source = "fracture_data"
  destination = "/data"
  snapshot_retention = 14
