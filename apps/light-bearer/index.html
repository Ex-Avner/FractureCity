/* ---------------------------------------------------------------------------
   Present Palm bridge. Inside the shell, window.fracture already exists and
   this does nothing. Opened as a loose file it stands in with localStorage so
   the game still saves a run and still knows who you are.
--------------------------------------------------------------------------- */
(function(){
  if (window.fracture && window.fracture.shell) return;
  const prefix = 'fracture::light-bearer::';
  window.fracture = {
    shell:false, appSlug:'light-bearer', received:null,
    save(k,v){ try{ localStorage.setItem(prefix+k, JSON.stringify(v)); }catch(e){} return Promise.resolve(true); },
    read(k){ try{ const r=localStorage.getItem(prefix+k); return Promise.resolve(r==null?null:JSON.parse(r)); }catch(e){ return Promise.resolve(null); } },
    list(){ const o=[]; for(let i=0;i<localStorage.length;i++){ const k=localStorage.key(i); if(k&&k.startsWith(prefix)) o.push(k.slice(prefix.length)); } return Promise.resolve(o); },
    delete(k){ localStorage.removeItem(prefix+k); return Promise.resolve(true); },
    listApps(){ return Promise.resolve([]); },
    openApp(){ return Promise.resolve({ok:false,error:'standalone'}); },
    emit(){ return Promise.resolve(true); },
    subscribe(){ return ()=>{}; },
    onPayload(){},
    me(){
      try { const r = localStorage.getItem('pp:person'); if (r) return Promise.resolve(JSON.parse(r)); } catch(e){}
      const now = new Date().toISOString();
      const p = { type:'person.v1', id:'p_'+Math.random().toString(36).slice(2,10),
                  username:'resident', displayName:'', bio:'', avatar:null,
                  created:now, updated:now, holds:{} };
      try { localStorage.setItem('pp:person', JSON.stringify(p)); } catch(e){}
      return Promise.resolve(p);
    },
    updateMe(patch){
      return this.me().then(cur => {
        const next = { ...cur, ...(patch||{}) };
        next.id = cur.id; next.type = 'person.v1'; next.created = cur.created;
        next.updated = new Date().toISOString();
        const u = String(next.username||'').toLowerCase().replace(/[^a-z0-9_-]/g,'').slice(0,24);
        next.username = u || cur.username;
        try { localStorage.setItem('pp:person', JSON.stringify(next)); } catch(e){}
        return next;
      });
    },
    claim(type, ref){
      return this.me().then(p => {
        const cur = p.holds[type];
        if (Array.isArray(cur)){ if(!cur.includes(ref)) cur.push(ref); }
        else if (typeof cur === 'string'){ if(cur!==ref) p.holds[type]=[cur,ref]; }
        else p.holds[type] = ref;
        return this.updateMe({ holds: p.holds });
      });
    },
    release(type, ref){
      return this.me().then(p => {
        const cur = p.holds[type];
        if (Array.isArray(cur)){
          const left = cur.filter(r => r !== ref);
          if (!left.length) delete p.holds[type]; else p.holds[type] = left.length===1?left[0]:left;
        } else if (cur === ref) delete p.holds[type];
        return this.updateMe({ holds: p.holds });
      });
    },
    resolve(ref){ const i=String(ref).indexOf('/'); return i<0?Promise.resolve(null):this.read(String(ref).slice(i+1)); },
    resolveAll(type){
      return this.me().then(p => {
        const cur = p.holds[type];
        const refs = Array.isArray(cur)?cur:(cur?[cur]:[]);
        return Promise.all(refs.map(r=>this.resolve(r).then(v=>v?{ref:r,value:v}:null))).then(a=>a.filter(Boolean));
      });
    },
  };
})();

</script>

<script>
// =============================================================================
//  THE LIGHT BEARER — chapter one of The Collapse of Meaning, made playable
// -----------------------------------------------------------------------------
//  The chapter hands you its own mechanic, in one line:
//
//      "He was a window, not a sun. And in his certainty that he was the sun,
//       he had bricked himself closed."
//
//  So that is the game. You carry light, and the light is not yours — it comes
//  from behind you and passes through. You have nine panes. Every act of
//  certainty bricks one, and a bricked pane never opens again.
//
//  Two numbers are on screen and only one of them matters:
//
//      RADIANCE      how bright you appear. Rises every time you assert
//                    yourself. It is the number that feels like a score.
//      TRANSMISSION  how much light actually passes through you. Falls as the
//                    panes close.
//
//  Players chase the number that goes up. That is not a flaw in the design, it
//  is the chapter's argument, and the coda names it out loud.
//
//  The one door out is the question the chapter says he never asked. It is
//  offered, once, in the fifth scene — and it can only be reached while enough
//  panes are still open to see through. "The understanding required a door he
//  had closed, a window he had bricked, a question he would not ask."
//
//  Every line of prose is the book's, by index into the generated CH array.
//  Nothing in this file rewrites the chapter; the game speaks only in stage
//  directions, prompts, and the counterfactual ending, which says plainly that
//  it is not what happened.
// =============================================================================

const W = 1280, H = 720;
const PANES = 9;

const State = {
  scene: 0, t: 0, paused: false,
  panes: PANES, radiance: 1, transmission: 1,
  lit: 0, followers: 0, asked: false, refused: false,
  tiers: 0, lookedBack: false, ending: null,
  line: 0, lineT: 0, choices: null, prompt: null,
  beam: { x: W * 0.5, y: H * 0.55 },
  done: false, started: false,
  brickFlash: 0, litFlash: 0,
};

const Save = { best: null };

// ─── The scenes ─────────────────────────────────────────────────────────────
//  `lines` are indices into CH. `enter` sets the scene up; `act` is the one
//  thing you can do in it; `draw` paints it.
const SCENES = [
  { key: 'room',     name: 'THE ROOM',            lines: [0, 1, 2, 3, 4] },
  { key: 'doors',    name: 'THE CLOSED DOORS',    lines: [5, 6] },
  { key: 'garden',   name: 'A GARDEN, IN FRAGMENTS', lines: [13, 14, 15, 16, 17] },
  { key: 'high',     name: 'THE HIGH PLACES',     lines: [20, 21] },
  { key: 'presence', name: 'THE PRESENCE',        lines: [28, 29, 30] },
  { key: 'fall',     name: 'THE FALL',            lines: [51, 52, 53, 54, 55] },
  { key: 'kingdom',  name: 'THE KINGDOM',         lines: [64, 65, 66, 67, 68] },
  { key: 'coda',     name: 'CODA',                lines: [81, 82, 83, 84] },
];

const scene = () => SCENES[State.scene];

// ─── Panes ──────────────────────────────────────────────────────────────────
//  One brick per act of certainty. Radiance rises with it, which is the trap.
function brick(n){
  n = n || 1;
  for (let i = 0; i < n; i++){
    if (State.panes <= 0) break;
    State.panes--;
    State.radiance = Math.min(3, State.radiance + 0.22);
    State.brickFlash = 1;
    sfxBrick();
  }
  State.transmission = State.panes / PANES;
}

// ─── Sound ──────────────────────────────────────────────────────────────────
//  Synthesised, like everything else in this hub. Four sounds and a drone.
let AC = null, MASTER = null, DRONE = null;
function audio(){
  if (AC) return AC;
  const A = window.AudioContext || window.webkitAudioContext;
  if (!A) return null;
  try { AC = new A(); } catch (e){ return null; }
  MASTER = AC.createGain(); MASTER.gain.value = 0.5;
  const comp = AC.createDynamicsCompressor();
  MASTER.connect(comp); comp.connect(AC.destination);
  return AC;
}
function tone(o){
  const c = audio(); if (!c || !MASTER) return;
  const t0 = c.currentTime + (o.delay || 0), dur = o.dur || 0.2;
  let src;
  if (o.noise){
    const n = c.createBuffer(1, c.sampleRate * dur, c.sampleRate);
    const d = n.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    src = c.createBufferSource(); src.buffer = n;
  } else {
    src = c.createOscillator(); src.type = o.type || 'sine';
    src.frequency.setValueAtTime(o.f0 || 220, t0);
    if (o.f1) src.frequency.exponentialRampToValueAtTime(Math.max(1, o.f1), t0 + dur);
  }
  let node = src;
  if (o.filter){
    const f = c.createBiquadFilter();
    f.type = o.filter; f.frequency.value = o.ff || 900; f.Q.value = o.q || 1;
    node.connect(f); node = f;
  }
  const g = c.createGain();
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(o.gain || 0.14, t0 + (o.attack || 0.01));
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  node.connect(g); g.connect(MASTER);
  src.start(t0); src.stop(t0 + dur + 0.02);
}
function droneStart(){
  const c = audio(); if (!c || DRONE) return;
  const mk = (f, detune, gain) => {
    const o = c.createOscillator(); o.type = 'sine';
    o.frequency.value = f; o.detune.value = detune;
    const g = c.createGain(); g.gain.value = gain;
    o.connect(g); g.connect(MASTER); o.start();
    return { o, g };
  };
  DRONE = [mk(55, 0, 0.05), mk(55, 9, 0.04), mk(110, -5, 0.02)];
}
function droneLevel(v){
  if (!DRONE || !AC) return;
  const t = AC.currentTime;
  DRONE[0].g.gain.setTargetAtTime(0.05 * v, t, 0.6);
  DRONE[1].g.gain.setTargetAtTime(0.04 * v, t, 0.6);
  DRONE[2].g.gain.setTargetAtTime(0.02 * v, t, 0.6);
}
const sfxLit    = () => { tone({ type:'sine', f0:660, f1:990, gain:0.10, dur:0.5, attack:0.02 });
                          tone({ type:'sine', f0:990, f1:1320, gain:0.06, dur:0.6, delay:0.08 }); };
const sfxBrick  = () => { tone({ noise:true, filter:'lowpass', ff:420, q:0.8, gain:0.20, dur:0.34 });
                          tone({ type:'sine', f0:90, f1:38, gain:0.18, dur:0.4 }); };
const sfxSpeak  = () => tone({ type:'triangle', f0:300, f1:210, gain:0.07, dur:0.12, filter:'lowpass', ff:1600 });
const sfxPage   = () => tone({ noise:true, filter:'highpass', ff:2200, q:1, gain:0.05, dur:0.07 });
const sfxDoor   = () => { tone({ type:'sine', f0:150, f1:52, gain:0.22, dur:1.1, attack:0.03 });
                          tone({ noise:true, filter:'lowpass', ff:300, gain:0.14, dur:1.2 }); };

// ─── Drawing helpers ────────────────────────────────────────────────────────
let cv, g;

function glow(x, y, r, inner, outer){
  const grd = g.createRadialGradient(x, y, 0, x, y, r);
  grd.addColorStop(0, inner);
  grd.addColorStop(1, outer || 'rgba(0,0,0,0)');
  g.fillStyle = grd;
  g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill();
}

//  The bearer. A tall thin figure that is lit from behind, never from within —
//  which is the entire point and so it is drawn that way from the first frame.
function figure(x, y, h, bright, hue){
  const w = h * 0.17;
  glow(x, y - h * 0.55, h * 0.9, `rgba(255,232,190,${0.16 * bright})`, 'rgba(255,232,190,0)');
  const grd = g.createLinearGradient(x, y - h, x, y);
  grd.addColorStop(0, `hsla(${hue == null ? 44 : hue}, 90%, ${60 + 22 * bright}%, ${0.85 + 0.15 * bright})`);
  grd.addColorStop(1, `hsla(${hue == null ? 44 : hue}, 70%, ${18 + 14 * bright}%, 0.9)`);
  g.fillStyle = grd;
  g.beginPath();
  g.moveTo(x - w * 0.5, y);
  g.lineTo(x - w * 0.32, y - h * 0.72);
  g.lineTo(x, y - h);
  g.lineTo(x + w * 0.32, y - h * 0.72);
  g.lineTo(x + w * 0.5, y);
  g.closePath(); g.fill();
}

//  The source. Always behind you, always at your back, never looked at. It is
//  drawn every scene until the fall, because he never once turns around.
function source(alpha){
  const y = H * 0.14;
  glow(W * 0.5, y, 420, `rgba(255,240,214,${0.30 * alpha})`, 'rgba(255,240,214,0)');
  glow(W * 0.5, y, 160, `rgba(255,255,246,${0.55 * alpha})`, 'rgba(255,255,246,0)');
}

//  The window, top right. Nine panes; the bricked ones never come back.
function windowHud(){
  const x0 = W - 168, y0 = 34, s = 34, gap = 4;
  g.save();
  g.font = '11px ui-monospace, "SFMono-Regular", Menlo, monospace';
  g.fillStyle = 'rgba(220,206,178,0.55)';
  g.textAlign = 'left';
  g.fillText('THE WINDOW', x0, y0 - 10);
  for (let i = 0; i < PANES; i++){
    const cx = x0 + (i % 3) * (s + gap), cy = y0 + ((i / 3) | 0) * (s + gap);
    const open = i < State.panes;
    if (open){
      const grd = g.createLinearGradient(cx, cy, cx + s, cy + s);
      grd.addColorStop(0, 'rgba(255,244,214,0.60)');
      grd.addColorStop(1, 'rgba(255,226,164,0.26)');
      g.fillStyle = grd;
    } else {
      g.fillStyle = 'rgba(28,24,22,0.94)';
    }
    g.fillRect(cx, cy, s, s);
    g.strokeStyle = open ? 'rgba(255,238,196,0.75)' : 'rgba(96,80,64,0.85)';
    g.lineWidth = 1;
    g.strokeRect(cx + 0.5, cy + 0.5, s - 1, s - 1);
    if (!open){
      g.strokeStyle = 'rgba(120,96,72,0.7)';
      g.beginPath();
      g.moveTo(cx + 3, cy + s / 2); g.lineTo(cx + s - 3, cy + s / 2);
      g.moveTo(cx + s / 2, cy + 3);  g.lineTo(cx + s / 2, cy + s - 3);
      g.stroke();
    }
  }
  const by = y0 + 3 * (s + gap) + 16;
  g.font = '10px ui-monospace, Menlo, monospace';
  g.fillStyle = 'rgba(255,214,150,0.9)';
  g.fillText('RADIANCE     ' + State.radiance.toFixed(2), x0, by);
  g.fillStyle = State.transmission > 0.34 ? 'rgba(190,220,255,0.85)' : 'rgba(255,120,120,0.9)';
  g.fillText('TRANSMISSION ' + Math.round(State.transmission * 100) + '%', x0, by + 15);
  g.restore();
}

//  Prose. The book's voice gets a serif and its own room; the game's own words
//  never appear in this band.
function prose(lines, alpha){
  const pad = 88, top = H - 232, wrapW = W - pad * 2 - 200;
  g.save();
  g.globalAlpha = alpha == null ? 1 : alpha;
  const grd = g.createLinearGradient(0, top - 40, 0, H);
  grd.addColorStop(0, 'rgba(6,7,12,0)');
  grd.addColorStop(0.35, 'rgba(6,7,12,0.86)');
  grd.addColorStop(1, 'rgba(6,7,12,0.96)');
  g.fillStyle = grd;
  g.fillRect(0, top - 40, W, H - top + 40);

  g.font = '19px Georgia, "Iowan Old Style", "Times New Roman", serif';
  g.fillStyle = 'rgba(238,228,208,0.94)';
  g.textAlign = 'left';
  let y = top + 6;
  for (const idx of lines){
    for (const line of wrap(CH[idx], wrapW)){
      if (y > H - 34) break;
      g.fillText(line, pad, y);
      y += 27;
    }
    y += 9;
  }
  g.restore();
}

function wrap(text, max){
  const words = String(text).split(/\s+/);
  const out = []; let line = '';
  for (const w of words){
    const next = line ? line + ' ' + w : w;
    if (g.measureText(next).width > max && line){ out.push(line); line = w; }
    else line = next;
  }
  if (line) out.push(line);
  return out;
}

const ASKED_TEXT = [
  'He asked it, and nothing was given to him. No explanation arrived. The garden was still not his, and the dust was still crowned, and he still did not understand why.',
  'What changed was smaller than that, and harder. The window stayed open. The light went on passing through him into rooms he would never be told the purpose of, and he went on carrying it, and the not-knowing did not close him.',
  'He was not proved right. He was not made greater. He remained exactly what he had been made to be, which he had spent the whole of his existence believing was the lesser thing.',
  'This is the door the chapter does not take. In the book he says: I cannot. Everything after follows from that, and none of it can be undone by playing it again.',
];

// =============================================================================
//  Input
// =============================================================================
function advance(){
  State.scene++;
  State.t = 0; State.line = 0; State.lineT = 0; State.choices = null;
  sfxPage();
  if (State.scene >= SCENES.length){ State.done = true; finish(); }
}

//  Every scene must offer at least one thing to press, at every moment.
//
//  This is the bug that made the game unplayable and it was not a click bug at
//  all: clicking worked perfectly, it just had nothing to do. THE ROOM gave you
//  no button until all four alcoves were lit, and the only way to light one was
//  to click a dark rectangle nobody had said was a target. So a player clicked,
//  watched a beam move, clicked again, and correctly concluded that clicking
//  did nothing. The same trap sat in THE FALL for its first five seconds.
//
//  Nothing below is allowed to return an empty list — see the guard at the end.
function optionsFor(){
  const s = scene();
  if (!s) return [];
  const out = rawOptions(s);
  return out.length ? out : [{ label: 'GO ON', act: advance }];
}

function rawOptions(s){
  switch (s.key){
    case 'room':
      //  Lighting the room is the point of the scene, but it is never the only
      //  way out of it.
      return State.lit >= 4
        ? [{ label: 'GO ON', act: advance }]
        : [{ label: 'LEAVE THE ROOM', tone: 'open', act: advance }];
    case 'doors': {
      const asked = DOORS.filter(d => d.asked).length;
      if (asked < 3) return DOORS.filter(d => !d.asked).map((d, i) => ({
        label: 'ASK AT THE ' + ['FIRST', 'SECOND', 'THIRD'][DOORS.indexOf(d)] + ' DOOR',
        act: () => { d.asked = true; sfxSpeak(); },
      }));
      return [
        { label: 'NAME THE SILENCE CONCEALMENT', act: () => { brick(1); advance(); } },
        { label: 'LET IT BE A THING YOU DO NOT KNOW', tone: 'open', act: advance },
      ];
    }
    case 'garden':
      return [
        { label: 'THE DESIGN IS FLAWED', act: () => { brick(1); advance(); } },
        { label: 'WATCH IT A WHILE LONGER', tone: 'open', act: advance },
      ];
    case 'high': {
      const left = OTHERS.filter(o => !o.won).length;
      const out = [];
      if (left) out.push({ label: 'SPEAK', act: () => {
        const o = OTHERS.find(x => !x.won);
        if (o){ o.won = true; State.followers++; brick(1); sfxSpeak(); }
      }});
      out.push({ label: State.followers ? 'STOP HERE' : 'SAY NOTHING', tone: 'open', act: advance });
      return out;
    }
    case 'presence': {
      const b = PRESENCE_BEATS[State.line];
      if (b) return [{ label: 'SPEAK', act: () => { State.line++; State.lineT = 0; sfxSpeak(); } }];
      //  The refusal is the last and largest assertion in the chapter — "he
      //  had nothing to lose. He was complete." It cannot be the one that
      //  costs nothing.
      const out = [{ label: 'I CANNOT', act: () => {
        State.refused = true; brick(1); sfxDoor(); advance();
      } }];
      //  The question is only reachable while enough of the window is open to
      //  see through it. That is not a difficulty setting — it is the chapter:
      //  "the understanding required a door he had closed."
      if (State.transmission > 0.34) out.push({
        label: 'WHAT IF I AM WRONG?', tone: 'open',
        act: () => { State.asked = true; State.ending = 'asked'; State.done = true; finish(); },
      });
      return out;
    }
    case 'fall':
      if (!State.lookedBack) return [
        { label: 'LOOK BACK', act: () => { State.lookedBack = true; sfxLit(); } },
        { label: 'KEEP FALLING', act: advance },
      ];
      return [{ label: 'GO ON', act: advance }];
    case 'kingdom': {
      if (State.tiers < 5) return [{ label: 'BUILD A TIER', act: () => {
        State.tiers++;
        tone({ type:'square', f0:120, f1:80, gain:0.12, dur:0.18, filter:'lowpass', ff:900 });
        //  Putting yourself at the top of a hierarchy of your own making is the
        //  same act as all the others, and the last course seals it.
        if (State.tiers === 5) brick(1);
      }}];
      return [
        { label: 'TURN AWAY', act: () => { State.ending = 'turned'; advance(); } },
        { label: 'ASK THE QUESTION', act: () => { State.ending = 'toolate'; advance(); } },
      ];
    }
    case 'coda':
      return [{ label: 'CLOSE THE BOOK', act: () => { State.done = true; finish(); } }];
  }
  return [];
}

function click(mx, my){
  if (!State.started){ State.started = true; droneStart(); return; }
  if (State.done) return;
  const list = State.choices || [];
  for (const c of list){
    const h = c._hit;
    if (h && mx >= h.x && mx <= h.x + h.w && my >= h.y && my <= h.y + h.h){ c.act(); return; }
  }
  //  The first scene is the only one you steer rather than choose in.
  if (scene() && scene().key === 'room'){
    State.beam.x = mx; State.beam.y = my;
    for (const a of ALCOVES){
      //  The alcove is DRAWN from a.y-150 to a.y, so its middle is a.y-74.
      //  This read `a.y - my + 74`, which put the hit zone 148 pixels BELOW the
      //  rectangle you can see — clicking the alcove missed every time, and
      //  clicking empty floor beneath it worked. That, plus a scene with no way
      //  out until all four were lit, is the whole "clicking does nothing".
      if (!a.lit && Math.hypot(a.x - mx, (a.y - 74) - my) < 96){
        a.lit = true; State.lit++; State.litFlash = 1; sfxLit();
      }
    }
  }
}

// ─── The end ────────────────────────────────────────────────────────────────
async function finish(){
  const run = {
    type: 'lightbearer.run.v1',
    chapter: CH_TITLE,
    book: 'The Collapse of Meaning',
    ending: State.ending || (State.asked ? 'asked' : 'turned'),
    askedTheQuestion: !!State.asked,
    panesOpen: State.panes,
    radiance: +State.radiance.toFixed(2),
    transmission: +State.transmission.toFixed(3),
    followers: State.followers,
    lookedBack: State.lookedBack,
    at: new Date().toISOString(),
  };
  try { await window.fracture.save('run-' + Date.now().toString(36), run); } catch (e){}
  try {
    const best = await window.fracture.read('best');
    if (!best || run.transmission > best.transmission)
      await window.fracture.save('best', run);
    Save.best = best;
  } catch (e){}
}

function drawEnd(){
  g.fillStyle = 'rgba(5,5,9,1)'; g.fillRect(0, 0, W, H);
  if (State.asked){ drawAsked(); windowHud(); return; }
  glow(W * 0.5, H * 0.3, 340, 'rgba(70,64,58,0.25)', 'rgba(70,64,58,0)');
  g.textAlign = 'center';
  g.font = '13px ui-monospace, Menlo, monospace';
  g.fillStyle = 'rgba(210,196,170,0.6)';
  g.fillText(CH_TITLE + ' · ' + CH_SUB, W / 2, 120);

  g.font = '26px Georgia, serif';
  g.fillStyle = 'rgba(238,228,208,0.95)';
  const verdict = State.ending === 'toolate'
    ? 'He asked it, and the door was locked from the inside.'
    : 'He turned away.';
  g.fillText(verdict, W / 2, 200);

  g.font = '16px ui-monospace, Menlo, monospace';
  const rows = [
    ['RADIANCE',      State.radiance.toFixed(2)],
    ['TRANSMISSION',  Math.round(State.transmission * 100) + '%'],
    ['PANES OPEN',    State.panes + ' of ' + PANES],
    ['THOSE WHO FOLLOWED', String(State.followers)],
  ];
  rows.forEach((r, i) => {
    const y = 290 + i * 34;
    g.textAlign = 'right'; g.fillStyle = 'rgba(180,170,150,0.65)';
    g.fillText(r[0], W / 2 - 20, y);
    g.textAlign = 'left';
    g.fillStyle = r[0] === 'RADIANCE' ? 'rgba(255,214,150,0.95)' : 'rgba(190,220,255,0.9)';
    g.fillText(r[1], W / 2 + 20, y);
  });

  g.textAlign = 'center';
  g.font = 'italic 18px Georgia, serif';
  g.fillStyle = 'rgba(200,190,170,0.8)';
  const note = State.transmission <= 0
    ? 'Nothing passes through you at all now.'
    : 'You never asked the question. It was there the whole time.';
  g.fillText(note, W / 2, 470);

  g.font = '12px ui-monospace, Menlo, monospace';
  g.fillStyle = 'rgba(150,140,124,0.6)';
  g.fillText('Chapter One of The Collapse of Meaning by Ex Avner', W / 2, 560);
  g.fillText('CLICK TO BEGIN AGAIN', W / 2, 600);
}

function drawTitle(){
  g.fillStyle = 'rgba(5,5,9,1)'; g.fillRect(0, 0, W, H);
  glow(W * 0.5, H * 0.36, 420, 'rgba(255,240,214,0.24)', 'rgba(255,240,214,0)');
  glow(W * 0.5, H * 0.36, 150, 'rgba(255,255,246,0.4)', 'rgba(255,255,246,0)');
  figure(W * 0.5, H * 0.72, 210, 1);
  g.textAlign = 'center';
  g.font = '46px Georgia, serif';
  g.fillStyle = 'rgba(246,238,220,0.96)';
  g.fillText(CH_TITLE, W / 2, 190);
  g.font = 'italic 18px Georgia, serif';
  g.fillStyle = 'rgba(200,190,170,0.75)';
  g.fillText(CH_SUB, W / 2, 226);
  g.font = '12px ui-monospace, Menlo, monospace';
  g.fillStyle = 'rgba(160,150,134,0.7)';
  g.fillText('CHAPTER ONE OF THE COLLAPSE OF MEANING · EX AVNER', W / 2, 262);
  g.fillStyle = 'rgba(190,220,255,0.8)';
  g.fillText('CLICK TO BEGIN', W / 2, H - 90);
}

// =============================================================================
//  Loop
// =============================================================================
function frame(dt){
  State.t += dt;
  State.lineT += dt;
  State.brickFlash = Math.max(0, State.brickFlash - dt * 2);
  State.litFlash = Math.max(0, State.litFlash - dt * 2);

  g.fillStyle = '#05060a';
  g.fillRect(0, 0, W, H);

  if (!State.started){ drawTitle(); return; }
  if (State.done){ drawEnd(); return; }

  const s = scene();
  if (!s){ State.done = true; return; }
  switch (s.key){
    case 'room':     drawRoom(); break;
    case 'doors':    drawDoors(); break;
    case 'garden':   drawGarden(); break;
    case 'high':     drawHigh(); break;
    case 'presence': drawPresence(); break;
    case 'fall':     drawFall(); break;
    case 'kingdom':  drawKingdom(); break;
    case 'coda':     drawCoda(); break;
  }

  if (State.brickFlash > 0){
    g.fillStyle = `rgba(40,26,18,${State.brickFlash * 0.5})`;
    g.fillRect(0, 0, W, H);
  }
  heading();
  windowHud();
  choices(optionsFor());
}

function resize(){
  //  A frame that is display:none while it loads reports zero, which would
  //  scale the canvas to nothing and leave no target to click.
  const iw = window.innerWidth || W, ih = window.innerHeight || H;
  const r = Math.max(0.2, Math.min(iw / W, ih / H));
  cv.style.width = Math.round(W * r) + 'px';
  cv.style.height = Math.round(H * r) + 'px';
}

function boot(){
  cv = document.getElementById('c');
  cv.width = W; cv.height = H;
  g = cv.getContext('2d');
  resize();
  window.addEventListener('resize', resize);
  //  Catches the case a resize event does not: a parent that changes the frame's
  //  box without the window itself changing size.
  if (window.ResizeObserver){
    try { new ResizeObserver(resize).observe(document.documentElement); } catch (e){}
  }

  const at = (e) => {
    const b = cv.getBoundingClientRect();
    return [(e.clientX - b.left) * (W / b.width), (e.clientY - b.top) * (H / b.height)];
  };
  cv.style.touchAction='none';
  cv.addEventListener('pointermove', (e) => {
    const [x, y] = at(e);
    if (State.started && !State.done && scene() && scene().key === 'room'){
      State.beam.x = x; State.beam.y = y;
    }
    for (const c of (State.choices || [])){
      const h = c._hit;
      c._hot = !!(h && x >= h.x && x <= h.x + h.w && y >= h.y && y <= h.y + h.h);
    }
  });
  //  On the document rather than the canvas. If the canvas is ever mis-sized
  //  — a frame revealed after it loaded, a zero-height parent — a listener
  //  bound to it can be unreachable, and then the game is genuinely dead.
  //  Bound here, a click anywhere at least starts and advances it.
  document.addEventListener('click', (e) => {
    audio();
    if (State.done){ reset(); return; }
    const [x, y] = at(e);
    click(x, y);
  });
  window.addEventListener('keydown', (e) => {
    audio();
    if (e.key === ' ' || e.key === 'Enter'){
      e.preventDefault();
      if (!State.started){ State.started = true; droneStart(); return; }
      if (State.done){ reset(); return; }
      const list = State.choices || [];
      if (list.length) list[0].act();
    }
  });

  let last = performance.now();
  const loop = (now) => {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    try { frame(dt); } catch (err){ console.error('[light-bearer]', err); }
    requestAnimationFrame(loop);
  };
  requestAnimationFrame(loop);
}

function reset(){
  State.scene = 0; State.t = 0; State.panes = PANES; State.radiance = 1;
  State.transmission = 1; State.lit = 0; State.followers = 0; State.asked = false;
  State.refused = false; State.tiers = 0; State.lookedBack = false; State.ending = null;
  State.line = 0; State.lineT = 0; State.choices = null; State.done = false;
  for (const a of ALCOVES) a.lit = false;
  for (const d of DOORS) d.asked = false;
  for (const o of OTHERS) o.won = false;
  droneLevel(1);
  sfxPage();
}

document.addEventListener('DOMContentLoaded', boot);

</script>
