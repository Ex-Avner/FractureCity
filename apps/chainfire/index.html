<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chainfire</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: one full-bleed canvas playfield; HUD floats over it, clear of safe areas. Deliberately single-theme (night arcade). */
:root {
  color-scheme: dark;
  --void: #0d0b1f; --ink: #f4f1ff; --dim: #a9a3cf; --line: #3b3566;
  --coral: #ff6b5e; --gold: #ffc94a; --cyan: #4fe0ff; --violet: #b07cff; --pink: #ff7ad9; --steel: #d9d4ff;
  --f-display: "Bungee", "Impact", "Arial Black", sans-serif;
  --f-body: "Rubik", "Segoe UI", system-ui, sans-serif;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--void); color: var(--ink); font-family: var(--f-body); overflow: hidden;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0;
  -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; touch-action: none; display: block; }
.hud { position: fixed; left: 0; right: 0; top: 0; display: flex; justify-content: space-between; align-items: flex-start;
  padding-top: calc(env(safe-area-inset-top, 0px) + 12px);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  pointer-events: none; gap: 12px; }
.score { font-family: var(--f-display); font-size: clamp(26px, 7vw, 40px); line-height: 1; letter-spacing: .02em; font-variant-numeric: tabular-nums; }
.sub { font-size: 11px; color: var(--dim); letter-spacing: .14em; text-transform: uppercase; font-weight: 700; }
.lvl { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
.bar { width: clamp(90px, 26vw, 140px); height: 6px; border-radius: 3px; background: rgba(255,255,255,.1); overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--cyan), var(--gold)); border-radius: 3px; transition: width .2s; }
.right { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
.lives { display: flex; gap: 6px; }
.lives i { width: 12px; height: 12px; border-radius: 50%; background: var(--cyan); box-shadow: 0 0 10px var(--cyan); display: block; transition: background .2s, box-shadow .2s; }
.iq { color: var(--pink); }
.swarmline { font-size: 14px; color: var(--pink); max-width: 340px; line-height: 1.45; margin: 0; }
.lives i.gone { background: transparent; box-shadow: inset 0 0 0 2px var(--line); }
.mute { pointer-events: auto; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.14); color: var(--dim);
  font: 700 11px var(--f-body); letter-spacing: .12em; text-transform: uppercase; padding: 7px 10px; border-radius: 999px; cursor: pointer; }
.mute:focus-visible, .btn:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }
.screen { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; text-align: center;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: calc(env(safe-area-inset-top, 0px) + 24px) calc(env(safe-area-inset-bottom, 0px) + 24px);
  background: radial-gradient(ellipse at 50% 40%, rgba(13,11,31,.55), rgba(13,11,31,.92)); overflow-y: auto; }
.logo { font-family: var(--f-display); font-size: clamp(48px, 15vw, 96px); line-height: .9; margin: 0;
  background: linear-gradient(180deg, var(--gold), var(--coral) 70%); -webkit-background-clip: text; background-clip: text; color: transparent;
  filter: drop-shadow(0 0 24px rgba(255,107,94,.45)); text-wrap: balance; }
.tag { font-size: clamp(16px, 4.4vw, 20px); color: var(--ink); max-width: 30ch; line-height: 1.45; margin: 0; }
.eyebrow { font: 700 12px var(--f-body); letter-spacing: .22em; text-transform: uppercase; color: var(--dim); margin: 0; }
.lname { font-family: var(--f-display); font-size: clamp(34px, 10vw, 56px); line-height: 1; margin: 0; color: var(--ink); text-wrap: balance; }
.newcard { display: flex; align-items: center; gap: 14px; text-align: left; background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.1);
  border-radius: 16px; padding: 14px 16px; max-width: 360px; }
.newcard canvas { position: static; width: 52px; height: 52px; flex: none; }
.newcard b { display: block; font: 700 11px var(--f-body); letter-spacing: .18em; text-transform: uppercase; color: var(--gold); margin-bottom: 4px; }
.newcard span { font-size: 14px; color: var(--ink); line-height: 1.4; }
.goal { font-size: 15px; color: var(--ink); margin: 0; }
.stargoal { font-size: 13px; color: var(--dim); margin: 0; }
.stargoal em { font-style: normal; color: var(--gold); }
.btns { display: flex; flex-direction: column; gap: 12px; align-items: center; }
.btn { font-family: var(--f-display); font-size: 20px; color: var(--void); background: var(--gold); border: 0; border-radius: 14px;
  padding: 14px 30px; cursor: pointer; box-shadow: 0 6px 0 #c4831c, 0 0 30px rgba(255,201,74,.35); }
.btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #c4831c; }
.btn.alt { background: transparent; color: var(--ink); box-shadow: inset 0 0 0 2px rgba(255,255,255,.25); font-size: 16px; padding: 12px 22px; }
.btn.alt:active { transform: translateY(2px); box-shadow: inset 0 0 0 2px rgba(255,255,255,.4); }
.final { font-family: var(--f-display); font-size: clamp(54px, 16vw, 88px); line-height: 1; color: var(--ink); font-variant-numeric: tabular-nums; }
.stats { display: flex; gap: 22px; color: var(--dim); font-size: 12px; letter-spacing: .1em; text-transform: uppercase; font-weight: 700; flex-wrap: wrap; justify-content: center; }
.stats b { display: block; color: var(--ink); font-family: var(--f-display); font-size: 24px; letter-spacing: 0; margin-top: 4px; font-weight: 400; font-variant-numeric: tabular-nums; }
.verdict { font-family: var(--f-display); color: var(--coral); font-size: 18px; letter-spacing: .04em; margin: 0; }
.stars { display: flex; gap: 10px; font-size: 44px; line-height: 1; }
.stars span { color: var(--line); transition: color .3s, transform .3s; }
.stars span.on { color: var(--gold); text-shadow: 0 0 18px rgba(255,201,74,.6); transform: scale(1.08); }
.note { color: var(--cyan); font-weight: 700; font-size: 14px; margin: 0; }
.shardline { display: inline-flex; align-items: center; gap: 6px; font: 700 15px var(--f-body); color: var(--ink); font-variant-numeric: tabular-nums; }
.gem { width: 12px; height: 12px; background: linear-gradient(135deg, #9ff3ff, var(--cyan) 45%, var(--violet)); transform: rotate(45deg); border-radius: 2px; box-shadow: 0 0 10px rgba(79,224,255,.6); display: inline-block; flex: none; }
#shop { justify-content: flex-start; gap: 14px; background: rgba(13,11,31,.97); }
.shophead { width: 100%; max-width: 560px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.shophead h2 { font-family: var(--f-display); font-size: 30px; margin: 0; }
.back { background: transparent; border: 1px solid rgba(255,255,255,.2); color: var(--ink); font: 700 13px var(--f-body); letter-spacing: .1em; text-transform: uppercase; padding: 9px 14px; border-radius: 999px; cursor: pointer; }
.tabs { display: flex; gap: 6px; background: rgba(255,255,255,.05); padding: 4px; border-radius: 999px; }
.tabs button { background: transparent; border: 0; color: var(--dim); font: 700 13px var(--f-body); letter-spacing: .08em; text-transform: uppercase; padding: 9px 16px; border-radius: 999px; cursor: pointer; }
.tabs button[aria-selected="true"] { background: var(--ink); color: var(--void); }
.grid { width: 100%; max-width: 560px; display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; padding-bottom: 8px; }
.item { background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.09); border-radius: 16px; padding: 12px; display: flex; flex-direction: column; align-items: center; gap: 8px; min-width: 0; }
.item.eq { border-color: var(--gold); box-shadow: 0 0 0 1px var(--gold) inset, 0 0 24px rgba(255,201,74,.15); }
.item canvas { position: static; width: 100%; max-width: 120px; aspect-ratio: 1; height: auto; border-radius: 12px; }
.item h3 { margin: 0; font: 700 15px var(--f-body); }
.item p { margin: 0; font-size: 12px; color: var(--dim); line-height: 1.35; min-height: 2.7em; }
.buy { width: 100%; border: 0; border-radius: 10px; padding: 9px 8px; font: 700 13px var(--f-body); cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; }
.buy.price { background: var(--cyan); color: var(--void); }
.buy.price:disabled { background: rgba(255,255,255,.08); color: var(--dim); cursor: default; }
.buy.price:not(:disabled) .gem { background: var(--void); box-shadow: none; }
.buy.own { background: rgba(255,255,255,.12); color: var(--ink); }
.buy.on { background: var(--gold); color: var(--void); cursor: default; }
.buy:focus-visible, .tabs button:focus-visible, .back:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { .bar i, .stars span { transition: none; } }
</style></head><body>

<canvas id="c"></canvas>

<div class="hud">
  <div>
    <div class="score" id="score">0</div>
    <div class="lvl"><span class="sub" id="lvl">Lvl 1</span><div class="bar"><i id="prog"></i></div></div>
  </div>
  <div class="right">
    <div class="lives" id="lives"><i></i><i></i><i></i></div>
    <div class="sub iq" id="iq" hidden>Swarm IQ 0</div>
    <button class="mute" id="mute" type="button">Sound on</button>
  </div>
</div>

<div class="screen" id="title">
  <h1 class="logo">CHAIN<br>FIRE</h1>
  <p class="tag">Drag back. Let go. Start a chain reaction.</p>
  <p class="stargoal" id="tbest">Best 0</p>
  <div class="btns">
    <button class="btn" id="play" type="button">Play</button>
    <button class="btn alt" id="cont" type="button" hidden>Continue · Level 2</button>
    <button class="btn alt" id="shopbtn" type="button">Shop · <span class="shardline"><i class="gem"></i><span id="tshards">0</span></span></button>
  </div>
</div>

<div class="screen" id="intro" hidden>
  <p class="eyebrow" id="inum">Level 1</p>
  <h2 class="lname" id="iname">First Spark</h2>
  <div class="newcard" id="inew"><canvas id="icon" width="104" height="104"></canvas><div><b id="inewlabel">New</b><span id="ihint"></span></div></div>
  <p class="goal" id="igoal">Detonate 18 targets</p>
  <p class="stargoal" id="istars"></p>
  <p class="swarmline" id="iswarm" hidden></p>
  <button class="btn" id="go" type="button">Go</button>
</div>

<div class="screen" id="clear" hidden>
  <p class="eyebrow" id="cnum">Level 1 clear</p>
  <div class="stars" id="cstars"><span>★</span><span>★</span><span>★</span></div>
  <div class="stats">
    <span>Biggest chain<b id="cchain">0</b></span>
    <span>Bonus<b id="cbonus">0</b></span>
    <span>Score<b id="cscore">0</b></span>
  </div>
  <p class="note" id="clife" hidden>+1 life</p>
  <p class="shardline"><i class="gem"></i><span id="cshards">+0 shards</span></p>
  <div class="btns">
    <button class="btn" id="next" type="button">Next level</button>
    <button class="btn alt" id="cshop" type="button">Shop</button>
  </div>
</div>

<div class="screen" id="over" hidden>
  <p class="verdict" id="verdict">The swarm got through</p>
  <div class="final" id="final">0</div>
  <div class="stats">
    <span>Level<b id="flevel">1</b></span>
    <span>Best<b id="fbest">0</b></span>
    <span>Biggest chain<b id="fchain">0</b></span>
  </div>
  <p class="shardline"><i class="gem"></i><span id="oshards">+0 shards</span></p>
  <div class="btns">
    <button class="btn" id="retry" type="button">Retry level</button>
    <button class="btn alt" id="menu" type="button">Main menu</button>
  </div>
</div>

<div class="screen" id="shop" hidden>
  <div class="shophead">
    <button class="back" id="shopback" type="button">Back</button>
    <h2>Shop</h2>
    <span class="shardline"><i class="gem"></i><span id="sshards">0</span></span>
  </div>
  <div class="tabs" role="tablist">
    <button role="tab" id="tab-balls" aria-selected="true" type="button">Balls</button>
    <button role="tab" id="tab-arenas" aria-selected="false" type="button">Arenas</button>
    <button role="tab" id="tab-blasts" aria-selected="false" type="button">Blasts</button>
  </div>
  <div class="grid" id="grid"></div>
</div>

<script>
(() => {
const cv = document.getElementById("c"), ctx = cv.getContext("2d");
let W = 0, H = 0, U = 1, DPR = 1, BOT = 0, stars = [], city = [];
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  cv.width = W * DPR; cv.height = H * DPR;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  U = Math.min(W, H * 0.62) / 100;
  BOT = H - Math.max(70, H * 0.12);
  stars = Array.from({ length: 90 }, () => ({ x: Math.random() * W, y: Math.random() * H, z: 0.2 + Math.random() * 0.8, t: Math.random() * 6.28 }));
  buildCity();
}
addEventListener("resize", resize); resize();
const $ = id => document.getElementById(id);
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
};
// ---------------- cosmetics ----------------
const TAU = 6.2832;
function glowDisc(c, x, y, R, col, k) { const g = c.createRadialGradient(x, y, R * 0.2, x, y, R * (k || 3)); g.addColorStop(0, col + "aa"); g.addColorStop(1, col + "00"); c.fillStyle = g; c.beginPath(); c.arc(x, y, R * (k || 3), 0, TAU); c.fill(); }
function sphere(c, x, y, R, light, mid, dark) { const g = c.createRadialGradient(x - R * 0.35, y - R * 0.4, R * 0.08, x, y, R); g.addColorStop(0, light); g.addColorStop(0.45, mid); g.addColorStop(1, dark); c.fillStyle = g; c.beginPath(); c.arc(x, y, R, 0, TAU); c.fill(); }
const BALLS = [
  { id: "pulse", name: "Pulse", price: 0, desc: "The original. Clean, bright, reliable.", glow: "#4fe0ff", trail: "glow",
    draw(c, x, y, R) { glowDisc(c, x, y, R, "#4fe0ff"); c.fillStyle = "#fff"; c.beginPath(); c.arc(x, y, R, 0, TAU); c.fill(); } },
  { id: "ember", name: "Ember", price: 250, desc: "A molten core that sheds flame as it flies.", glow: "#ff8a3d", trail: "flame",
    draw(c, x, y, R, t) { glowDisc(c, x, y, R * (1 + 0.08 * Math.sin(t * 20)), "#ff8a3d"); sphere(c, x, y, R, "#fff4c2", "#ffb03a", "#d8401c"); } },
  { id: "eight", name: "Eight Ball", price: 350, desc: "Rolls with real spin. Bad luck for targets.", glow: "#c9c4ff", trail: "glow",
    draw(c, x, y, R, t, ang) { glowDisc(c, x, y, R, "#8f88d6", 2.2); sphere(c, x, y, R, "#6b6880", "#1b1a24", "#050508");
      c.save(); c.translate(x, y); c.rotate(ang); c.fillStyle = "#f4f1ff"; c.beginPath(); c.arc(R * 0.18, 0, R * 0.42, 0, TAU); c.fill();
      c.fillStyle = "#111"; c.font = `700 ${Math.max(6, R * 0.6)}px Rubik, sans-serif`; c.textAlign = "center"; c.textBaseline = "middle"; c.fillText("8", R * 0.18, R * 0.04); c.restore(); } },
  { id: "grin", name: "Grin", price: 450, desc: "Smiles at rest. Screams at full speed.", glow: "#ffd84a", trail: "glow",
    draw(c, x, y, R, t, ang, sp) { glowDisc(c, x, y, R, "#ffd84a", 2.4); sphere(c, x, y, R, "#fff7b0", "#ffd23a", "#d99a10");
      const fast = sp > 0.45; c.fillStyle = "#3a2400"; c.strokeStyle = "#3a2400"; c.lineWidth = Math.max(1, R * 0.12);
      c.beginPath(); c.arc(x - R * 0.33, y - R * 0.22, R * (fast ? 0.16 : 0.11), 0, TAU); c.arc(x + R * 0.33, y - R * 0.22, R * (fast ? 0.16 : 0.11), 0, TAU); c.fill();
      if (fast) { c.beginPath(); c.ellipse(x, y + R * 0.32, R * 0.22, R * 0.28, 0, 0, TAU); c.fill(); } else { c.beginPath(); c.arc(x, y + R * 0.05, R * 0.45, 0.5, Math.PI - 0.5); c.stroke(); } } },
  { id: "eye", name: "Watcher", price: 600, desc: "Always looking at its next victim.", glow: "#ff6b8a", trail: "glow",
    draw(c, x, y, R, t, ang, sp, look) { glowDisc(c, x, y, R, "#ff6b8a", 2.4); sphere(c, x, y, R, "#ffffff", "#f1ecf2", "#c9b6c9");
      c.strokeStyle = "rgba(220,60,80,.5)"; c.lineWidth = 1; for (let i = 0; i < 4; i++) { const a = i * 1.6 + 0.4; c.beginPath(); c.moveTo(x + Math.cos(a) * R * 0.95, y + Math.sin(a) * R * 0.95); c.lineTo(x + Math.cos(a + 0.2) * R * 0.6, y + Math.sin(a + 0.2) * R * 0.6); c.stroke(); }
      const ix = x + Math.cos(look) * R * 0.38, iy = y + Math.sin(look) * R * 0.38;
      c.fillStyle = "#2fb38a"; c.beginPath(); c.arc(ix, iy, R * 0.42, 0, TAU); c.fill();
      c.fillStyle = "#081410"; c.beginPath(); c.arc(ix, iy, R * 0.2, 0, TAU); c.fill();
      c.fillStyle = "#fff"; c.beginPath(); c.arc(ix - R * 0.1, iy - R * 0.1, R * 0.07, 0, TAU); c.fill(); } },
  { id: "glacier", name: "Glacier", price: 700, desc: "A faceted ice crystal that leaves frost behind.", glow: "#9fe8ff", trail: "sparkle",
    draw(c, x, y, R, t) { glowDisc(c, x, y, R, "#9fe8ff"); c.save(); c.translate(x, y); c.rotate(t * 0.8);
      const g = c.createLinearGradient(-R, -R, R, R); g.addColorStop(0, "#ffffff"); g.addColorStop(0.5, "#9fe8ff"); g.addColorStop(1, "#3b8fd9"); c.fillStyle = g;
      c.beginPath(); for (let i = 0; i < 6; i++) { const a = i * TAU / 6; c[i ? "lineTo" : "moveTo"](Math.cos(a) * R * 1.1, Math.sin(a) * R * 1.1); } c.closePath(); c.fill();
      c.strokeStyle = "rgba(255,255,255,.7)"; c.lineWidth = 1; c.beginPath(); for (let i = 0; i < 3; i++) { const a = i * TAU / 6; c.moveTo(Math.cos(a) * R * 1.1, Math.sin(a) * R * 1.1); c.lineTo(-Math.cos(a) * R * 1.1, -Math.sin(a) * R * 1.1); } c.stroke(); c.restore(); } },
  { id: "planet", name: "Ringworld", price: 850, desc: "A tiny gas giant with a tilted ring.", glow: "#ffb36b", trail: "glow",
    draw(c, x, y, R, t) { glowDisc(c, x, y, R, "#ffb36b", 2.6);
      c.save(); c.translate(x, y); c.rotate(-0.4); c.strokeStyle = "rgba(255,226,180,.85)"; c.lineWidth = Math.max(1.5, R * 0.18);
      c.beginPath(); c.ellipse(0, 0, R * 1.7, R * 0.5, 0, Math.PI, TAU); c.stroke(); c.restore();
      c.save(); c.beginPath(); c.arc(x, y, R, 0, TAU); c.clip(); sphere(c, x, y, R, "#ffe3b0", "#e98a3a", "#7a3a1a");
      c.fillStyle = "rgba(122,58,26,.35)"; for (let i = -2; i <= 2; i++) c.fillRect(x - R, y + i * R * 0.38 + Math.sin(t + i) * R * 0.05, R * 2, R * 0.13); c.restore();
      c.save(); c.translate(x, y); c.rotate(-0.4); c.strokeStyle = "rgba(255,226,180,.95)"; c.lineWidth = Math.max(1.5, R * 0.18);
      c.beginPath(); c.ellipse(0, 0, R * 1.7, R * 0.5, 0, 0, Math.PI); c.stroke(); c.restore(); } },
  { id: "disco", name: "Disco", price: 1000, desc: "Mirror tiles. Throws light everywhere it goes.", glow: "#e3d9ff", trail: "rainbow",
    draw(c, x, y, R, t) { glowDisc(c, x, y, R, "#e3d9ff");
      c.save(); c.beginPath(); c.arc(x, y, R, 0, TAU); c.clip(); c.fillStyle = "#8d8aa3"; c.fillRect(x - R, y - R, R * 2, R * 2);
      const n = 6, s = R * 2 / n, off = (t * R * 0.8) % s;
      for (let i = -1; i <= n; i++) for (let j = 0; j < n; j++) { const v = Math.sin(i * 1.7 + j * 2.3 + Math.floor(t * 4)) * 0.5 + 0.5;
        c.fillStyle = v > 0.82 ? `hsl(${(i * 40 + j * 70 + t * 100) % 360},100%,80%)` : `rgba(255,255,255,${0.25 + v * 0.55})`;
        c.fillRect(x - R + i * s + off + 0.6, y - R + j * s + 0.6, s - 1.2, s - 1.2); }
      const sh = c.createRadialGradient(x - R * 0.4, y - R * 0.4, 0, x, y, R); sh.addColorStop(0, "rgba(255,255,255,.4)"); sh.addColorStop(1, "rgba(0,0,0,.45)"); c.fillStyle = sh; c.fillRect(x - R, y - R, R * 2, R * 2); c.restore(); } },

    const core = c.createRadialGradient(0, 0, 0, 0, 0, r * 0.55); core.addColorStop(0, "#fff"); core.addColorStop(0.4, "#ffc94a"); core.addColorStop(1, "#ff6b5e"); c.fillStyle = core; c.beginPath(); c.arc(0, 0, r * 0.45, 0, 6.283); c.fill(); c.restore(); return; }
  drawTarget(c, { x: 52, y: 56, r: 22, type, hp: T.hp || 1, hit: 0, fuse: -1, spin: 0.4, wob: 0, vx: 1 }, T, 0);
}
function showIntro() {
  hideAll(); state = "intro"; L = levelDef(level);
  targets = []; boss = null; parts = []; rings = []; shards = []; texts = [];
  $("inum").textContent = "Level " + level + ((starsSaved[level] || 0) ? "  ·  " + "★".repeat(starsSaved[level]) : "");
  $("iname").textContent = L.name;
  const hint = L.hint || (level === 1 ? "Fling your orb into the swarm. Everything it touches explodes, and explosions set off their neighbors." : null);
  $("inew").hidden = !hint;
  if (hint) { $("ihint").textContent = hint; $("inewlabel").textContent = L.intro ? "New · " + TYPES[L.intro].name : level === 1 ? "How it works" : "Heads up"; drawIcon(L.intro || "basic"); }
  $("igoal").textContent = L.boss ? "Destroy the Core" : "Detonate " + L.quota + " targets";
  const intel = swarmIntel(); $("iswarm").hidden = !intel; if (intel) $("iswarm").textContent = intel;
  $("istars").innerHTML = `<em>★★</em> chain ${L.s2} &nbsp;·&nbsp; <em>★★★</em> chain ${L.s3}`;
  updateHud();
  $("intro").hidden = false;
}
function beginLevel() {
  audio(); hideAll();
  resetLevel(); levelStart = score; shots = 0; state = "play";
  if (!L.boss) { for (let i = 0; i < 2; i++) spawn(); targets.forEach(t => t.y += 18 * U); }
}
function newRun(n) { score = 0; lives = 3; maxChain = 0; supernova = false; level = n; brain = newBrain(); showIntro(); }
function toTitle() {
  hideAll(); state = "title"; L = LEVELS[0]; targets = []; boss = null; score = 0; lives = 3; updateHud();
  $("tbest").textContent = best ? "Best " + best.toLocaleString() : "Twelve-plus chains charge a supernova";
  const c = $("cont"); c.hidden = unlocked <= 1; c.textContent = "Continue · Level " + unlocked;
  $("tshards").textContent = gems.toLocaleString();
  $("title").hidden = false;
}
$("play").addEventListener("click", () => { audio(); newRun(1); });
$("cont").addEventListener("click", () => { audio(); newRun(unlocked); });
$("go").addEventListener("click", beginLevel);
$("next").addEventListener("click", () => { level++; showIntro(); });
$("retry").addEventListener("click", () => { score = levelStart; lives = 3; maxChain = 0; showIntro(); });
$("menu").addEventListener("click", toTitle);

// ---------------- shop ----------------
let shopTab = "balls", shopFrom = "title", shopRAF = 0, shopCanvases = [];
const CATS = { balls: { list: BALLS, slot: "ball" }, arenas: { list: ARENAS, slot: "arena" }, blasts: { list: BLASTS, slot: "blast" } };
function openShop(from) { shopFrom = from; hideAll(); $("shop").hidden = false; renderShop(); cancelAnimationFrame(shopRAF); shopRAF = requestAnimationFrame(shopLoop); }
function closeShop() {
  cancelAnimationFrame(shopRAF); $("shop").hidden = true;
  if (shopFrom === "clear") $("clear").hidden = false; else toTitle();
}
function renderShop() {
  $("sshards").textContent = gems.toLocaleString();
  ["balls", "arenas", "blasts"].forEach(k => $("tab-" + k).setAttribute("aria-selected", k === shopTab ? "true" : "false"));
  const { list, slot } = CATS[shopTab], grid = $("grid");
  grid.innerHTML = ""; shopCanvases = [];
  for (const it of list) {
    const has = !!owned[it.id], eq = cosmetic[slot] === it.id;
    const card = document.createElement("div"); card.className = "item" + (eq ? " eq" : "");
    const cvs = document.createElement("canvas"); cvs.width = 240; cvs.height = 240; card.appendChild(cvs);
    shopCanvases.push({ cvs, it, cat: shopTab, seed: Math.random() * 10, parts: [] });
    const h = document.createElement("h3"); h.textContent = it.name; card.appendChild(h);
    const p = document.createElement("p"); p.textContent = it.desc; card.appendChild(p);
    const b = document.createElement("button"); b.type = "button"; b.id = "buy-" + it.id;
    if (eq) { b.className = "buy on"; b.textContent = "Equipped"; }
    else if (has) { b.className = "buy own"; b.textContent = "Equip"; b.onclick = () => { cosmetic[slot] = it.id; store.set("cf-cos", cosmetic); tone(660, "triangle", 0.12, 0.08); renderShop(); }; }
    else { b.className = "buy price"; const short = it.price - gems;
      b.innerHTML = short > 0 ? `<i class="gem"></i> ${it.price.toLocaleString()}` : `Buy · <i class="gem"></i> ${it.price.toLocaleString()}`;
      if (short > 0) { b.disabled = true; b.title = short.toLocaleString() + " more shards needed"; }
      else b.onclick = () => { gems -= it.price; owned[it.id] = 1; cosmetic[slot] = it.id; store.set("cf-shards", gems); store.set("cf-owned", owned); store.set("cf-cos", cosmetic);
        fanfare(); buzz(30); renderShop(); }; }
    card.appendChild(b); grid.appendChild(card);
  }
}
function shopLoop(now) {
  const t = now / 1000;
  for (const sc of shopCanvases) {
    const c = sc.cvs.getContext("2d"), w = 240, h = 240;
    c.setTransform(1, 0, 0, 1, 0, 0); c.clearRect(0, 0, w, h);
    if (sc.cat === "arenas") { c.save(); drawArena(c, w, h, t + sc.seed, sc.it.id, "#151231", 20, false, true); c.restore(); continue; }
    c.fillStyle = "#120f28"; c.fillRect(0, 0, w, h);
    if (sc.cat === "balls") {
      const x = w / 2 + Math.sin(t * 1.3 + sc.seed) * 34, y = h / 2 + Math.sin(t * 2.1 + sc.seed) * 18, vx = Math.cos(t * 1.3 + sc.seed);
      sc.it.draw(c, x, y, 30, t, t * 3 * Math.sign(vx), 0.5 + 0.5 * Math.sin(t * 0.9), Math.atan2(Math.cos(t * 2.1 + sc.seed) * 2.1 * 18, vx * 1.3 * 34));
    } else {
      // blast preview: periodic burst
      if (!sc.parts.length || Math.random() < 0.012) {
        const cols = ["#4fe0ff", "#ff6b5e", "#b07cff", "#ffc94a"];
        for (let i = 0; i < 26; i++) { const a = Math.random() * TAU, s = 40 + Math.random() * 120, sh = sc.it.id, grav = sh === "confetti" || sh === "star";
          const base = cols[Math.floor(Math.random() * 4)];
          sc.parts.push({ x: w / 2, y: h / 2, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 1.2, c: sh === "confetti" ? hslHex(Math.random() * 360, 95, 65) : sh === "star" ? (Math.random() < 0.6 ? "#ffd75e" : "#fff6d8") : base, r: 3 + Math.random() * 3, shape: sh, a: Math.random() * 6, va: (Math.random() - .5) * 14, g: grav ? 160 : 0 }); }
      }
      const dt = 1 / 60;
      c.globalCompositeOperation = "lighter";
      for (const p of sc.parts) { p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= Math.pow(0.15, dt); p.vy *= Math.pow(0.15, dt); p.vy += p.g * dt; p.a += p.va * dt; p.life -= dt;
        c.fillStyle = p.c; c.globalAlpha = Math.max(0, Math.min(1, p.life * 1.5)); drawParticle(c, p); }
      c.globalAlpha = 1; c.globalCompositeOperation = "source-over";
      sc.parts = sc.parts.filter(p => p.life > 0);
    }
  }
  shopRAF = requestAnimationFrame(shopLoop);
}
["balls", "arenas", "blasts"].forEach(k => $("tab-" + k).addEventListener("click", () => { shopTab = k; renderShop(); }));
$("shopbtn").addEventListener("click", () => { audio(); openShop("title"); });
$("cshop").addEventListener("click", () => openShop("clear"));
$("shopback").addEventListener("click", closeShop);

resetLevel(); toTitle();
requestAnimationFrame(frame);
})();
</script>
