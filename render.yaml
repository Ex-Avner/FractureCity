# Persistent multiplayer + accounts. Review Render's price before deploying.
# Keep one instance: the database and room state are local to this server.
services:
  - type: web
    name: fracture-city-online
    runtime: node
    region: oregon
    plan: 1c-2g
    numInstances: 1
    autoDeployTrigger: off
    buildCommand: node --version
    startCommand: node server/start.cjs
    healthCheckPath: /health
    disk:
      name: fracture-city-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: '24'
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: DB_PATH
        value: /var/data/districts.sqlite
      - key: BACKUP_DIR
        value: /var/data/backups
      - key: MAX_ROOMS
        value: '1'
