# Persistent multiplayer + accounts. Review Render's price before deploying.
# Keep one instance: the database and room state are local to this server.
services:
  - type: web
    name: fracture-city-online
    runtime: node
    region: oregon
    plan: 1c-2g
    numInstances: 1
    autoDeployTrigger: off
    buildCommand: node --version
    startCommand: node server/start.cjs
    healthCheckPath: /health
    disk:
      name: fracture-city-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: '24'
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: DB_PATH
        value: /var/data/districts.sqlite
      - key: BACKUP_DIR
        value: /var/data/backups
      # The Main Beta keeps one reserved slot; private invite rooms share the rest.
      - key: MAX_ROOMS
        value: '3'
      # Your account username(s), comma separated. Only these accounts can
      # /remove or /allow residents in the Main Beta. Render asks for the value.
      - key: OWNER_USERNAMES
        sync: false
      - key: BACKUP_KEEP
        value: '7'
      # Render's proxy fronts every request; key rate limits by the client
      # address it forwards, not by the proxy's own address.
      - key: TRUST_PROXY
        value: '1'
